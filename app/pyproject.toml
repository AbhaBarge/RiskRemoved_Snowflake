# Dependency file for the Streamlit-in-Snowflake container runtime.
#
# The runtime will not start without one, and it installs exactly what is listed
# into a fresh environment (an empty list leaves out Streamlit itself). Packages
# come from the artifact repository attached at deploy time
# (conf/base.yml:app.artifact_repository, Snowflake's built-in PyPI mirror),
# because this trial account has no external access. List only what the app
# imports. Local development uses the repository's own pyproject.toml [app] extra.
[project]
name = "risk-copilot-app"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "streamlit[snowflake]>=1.50",
    "pandas>=2.0",
    "altair>=5.3",
]
