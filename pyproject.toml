[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-copilot"
version = "0.1.0"
description = "Risk & Compliance Copilot -- Snowflake-native AML signal-to-STR pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }

dependencies = [
    # --- Snowflake ---------------------------------------------------------
    "snowflake-snowpark-python>=1.20",
    "snowflake-connector-python>=3.12",
    "snowflake-core>=1.0",

    # --- Configuration -----------------------------------------------------
    # Layered YAML config + fail-fast validation. No value is hardcoded in
    # source; every tunable resolves through conf/ or GOVERNANCE.POLICY_CLAUSE.
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "Jinja2>=3.1",

    # --- CLI / UX ----------------------------------------------------------
    "typer>=0.12",
    "rich>=13.7",

    # --- Data generation (L1/L2) -------------------------------------------
    "Faker>=25.0",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
ml = [
    # Snowflake-native ML. Tier-1 build uses only built-in SQL ML functions
    # (JAROWINKLER_SIMILARITY, SNOWFLAKE.ML.ANOMALY_DETECTION); this extra is
    # for the Feature Store / Model Registry items in Future Scope.
    "snowflake-ml-python>=1.6",
]
app = [
    "streamlit>=1.36",
    "altair>=5.3",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "pre-commit>=3.7",
]

[project.scripts]
# Single entry point for every operation: generate | load | deploy | replay |
# eval | doctor.  Nothing is invoked by running a loose script.
riskcopilot = "risk_copilot.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
risk_copilot = ["py.typed"]

# ---------------------------------------------------------------------------
# Lint / format -- ruff replaces black + isort + flake8
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "N",           # pep8-naming
    "UP",          # pyupgrade
    "B",           # bugbear
    "A",           # builtins shadowing
    "C4",          # comprehensions
    "SIM",         # simplify
    "PTH",         # use pathlib
    "RUF",
    "S",           # bandit -- security
]
ignore = [
    "S101",        # assert is fine in tests and validation gates
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N802"]
# The capability probe exists to execute literal DDL and record what the account
# says. Every identifier it interpolates is a module-level constant -- there is no
# external input to inject -- so S608 reports only the fact that the file builds
# SQL strings, which is its entire purpose.
"scripts/probe_capabilities.py" = ["S608"]
# The loader builds COPY / INSERT statements from identifiers only: configured
# object names (validated by config.validate_identifier at load), live
# INFORMATION_SCHEMA column names (validated again before use) and module
# constants. Every value taken from data is a bind parameter; nothing read from
# a data file is interpolated. S608 flags the string building itself.
"src/risk_copilot/pipeline/load.py" = ["S608"]
# Replay reuses the loader's builders under the same rule: configured and live,
# validated identifiers only; every timestamp, party id and cohort is bound.
"src/risk_copilot/pipeline/replay.py" = ["S608"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------
[tool.mypy]
# python_version is deliberately unset so mypy follows the running interpreter.
# Pinning it to 3.11 makes the bundled numpy stubs (which use 3.12 `type`
# statements) fail to parse on a 3.12 environment.
packages = ["risk_copilot"]
mypy_path = "src"
strict = true
warn_unreachable = true
# Snowflake + Faker ship incomplete stubs.
[[tool.mypy.overrides]]
module = ["snowflake.*", "faker.*", "pyarrow.*", "streamlit.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "unit: no Snowflake connection required (default)",
    "integration: requires a live Snowflake connection",
    "eval: evaluation suites (detection F1, text-to-SQL); requires loaded data",
]
