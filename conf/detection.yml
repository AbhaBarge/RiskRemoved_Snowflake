# ===========================================================================
# detection.yml -- TIER 3 SEED VALUES for GOVERNANCE.POLICY_CLAUSE
# ===========================================================================
# IMPORTANT: this file is a SEED, not the runtime source of truth.
#
# Detection SQL never reads these numbers directly. `riskcopilot deploy
# --stage policy` loads them into GOVERNANCE.POLICY_CLAUSE, and the dynamic
# tables join to POLICY_CLAUSE to resolve every threshold at refresh time.
# That is what makes the architecture's "policy-as-data" claim real rather
# than decorative: changing a threshold is a governed data change with an
# effective date and an audit trail, not a code deploy.
#
# `provenance` must cite a real regulation or an internal document. A clause
# with no provenance fails the deploy-time validation gate -- this is how we
# guarantee the demo never cites a hallucinated circular number.
# ===========================================================================

currency:
  code: INR
  symbol: "\u20b9"
  # Presentation helpers only -- never used in detection arithmetic.
  lakh: 100000
  crore: 10000000

clauses:

  # -------------------------------------------------------------------------
  # Cash Transaction Report trigger. The anchor threshold for the whole
  # structuring story.
  # -------------------------------------------------------------------------
  - clause_id: CTR_CASH_THRESHOLD
    metric: cash_txn_amount_inr
    operator: ">="
    threshold_lower: 1000000          # Rs 10,00,000 (10 lakh)
    threshold_upper: null
    action_required: FILE_CTR
    effective_from: "2005-07-01"
    provenance:
      source_document: PML (Maintenance of Records) Rules, 2005
      section_heading: Rule 3(1)(A) - cash transactions
      source_page: null
    notes: >
      All cash transactions of the value of more than ten lakh rupees, or its
      equivalent in foreign currency. Anchors STRUCTURING_CROSS_ACCOUNT.

  # -------------------------------------------------------------------------
  # Structuring band -- deposits deliberately parked below the CTR trigger.
  # Band is expressed as a fraction of CTR_CASH_THRESHOLD so the two can never
  # drift apart when the statutory threshold changes.
  # -------------------------------------------------------------------------
  - clause_id: STRUCTURING_BAND
    metric: cash_txn_amount_ratio_to_ctr
    operator: BETWEEN
    threshold_lower: 0.90             # >= 90% of the CTR threshold
    threshold_upper: 0.999            # but strictly below it
    action_required: RAISE_SIGNAL
    effective_from: "2005-07-01"
    provenance:
      source_document: Internal - Transaction Monitoring Rulebook
      section_heading: TM-04 Structuring below reporting threshold
      source_page: null
    notes: >
      Derived control, not a statutory threshold. Rs 9.0L-9.99L against a
      Rs 10L trigger.

  - clause_id: STRUCTURING_MIN_ACCOUNTS
    metric: distinct_accounts_in_window
    operator: ">="
    threshold_lower: 2
    threshold_upper: null
    action_required: RAISE_SIGNAL
    effective_from: "2005-07-01"
    provenance:
      source_document: Internal - Transaction Monitoring Rulebook
      section_heading: TM-04 Structuring below reporting threshold
      source_page: null

  - clause_id: STRUCTURING_WINDOW_DAYS
    metric: observation_window_days
    operator: "<="
    threshold_lower: 30
    threshold_upper: null
    action_required: RAISE_SIGNAL
    effective_from: "2005-07-01"
    provenance:
      source_document: Internal - Transaction Monitoring Rulebook
      section_heading: TM-04 Structuring below reporting threshold
      source_page: null

  # -------------------------------------------------------------------------
  # Income vs activity. GAP-04: only meaningful because generation correlates
  # declared income with observed legitimate inflow.
  # -------------------------------------------------------------------------
  - clause_id: INCOME_MISMATCH_MULTIPLE
    metric: inflow_30d_to_declared_annual_income_ratio
    operator: ">="
    threshold_lower: 3.0
    threshold_upper: null
    action_required: RAISE_SIGNAL
    effective_from: "2016-02-25"
    provenance:
      source_document: RBI Master Direction - Know Your Customer, 2016
      section_heading: Ongoing monitoring - consistency with declared profile
      source_page: null
    notes: >
      RBI requires monitoring for consistency with the customer's declared
      profile; the 3x multiple is the institution's calibration of that duty.

  - clause_id: INCOME_MISMATCH_MIN_INFLOW
    metric: inflow_30d_amount_inr
    operator: ">="
    threshold_lower: 500000
    threshold_upper: null
    action_required: RAISE_SIGNAL
    effective_from: "2016-02-25"
    provenance:
      source_document: Internal - Transaction Monitoring Rulebook
      section_heading: TM-07 Income inconsistency - noise floor
      source_page: null
    notes: Suppresses ratio blow-ups on very low declared incomes.

  # -------------------------------------------------------------------------
  # Mule-account velocity.
  # -------------------------------------------------------------------------
  - clause_id: RAPID_CREDIT_MIN_COUNT
    metric: credit_count_in_window
    operator: ">="
    threshold_lower: 10
    threshold_upper: null
    action_required: RAISE_SIGNAL
    effective_from: "2016-02-25"
    provenance:
      source_document: Internal - Transaction Monitoring Rulebook
      section_heading: TM-11 Rapid credit velocity (mule indicator)
      source_page: null

  - clause_id: RAPID_CREDIT_MIN_REMITTERS
    metric: distinct_remitters_in_window
    operator: ">="
    threshold_lower: 6
    threshold_upper: null
    action_required: RAISE_SIGNAL
    effective_from: "2016-02-25"
    provenance:
      source_document: Internal - Transaction Monitoring Rulebook
      section_heading: TM-11 Rapid credit velocity (mule indicator)
      source_page: null

  - clause_id: RAPID_CREDIT_WINDOW_DAYS
    metric: observation_window_days
    operator: "<="
    threshold_lower: 3
    threshold_upper: null
    action_required: RAISE_SIGNAL
    effective_from: "2016-02-25"
    provenance:
      source_document: Internal - Transaction Monitoring Rulebook
      section_heading: TM-11 Rapid credit velocity (mule indicator)
      source_page: null

  # -------------------------------------------------------------------------
  # Shared-device clustering. GAP-05: generation must co-locate shared
  # fingerprints with existing fund flows or this rule returns zero rows.
  # -------------------------------------------------------------------------
  - clause_id: SHARED_DEVICE_MIN_ACCOUNTS
    metric: accounts_sharing_device_fingerprint
    operator: ">="
    threshold_lower: 3
    threshold_upper: null
    action_required: RAISE_SIGNAL
    effective_from: "2016-02-25"
    provenance:
      source_document: Internal - Transaction Monitoring Rulebook
      section_heading: TM-15 Device sharing across unrelated customers
      source_page: null

  # -------------------------------------------------------------------------
  # Sanctions screening. Exact match is authoritative; the fuzzy band is
  # review-only and must never by itself justify a filing.
  # -------------------------------------------------------------------------
  - clause_id: SANCTIONS_EXACT_MATCH
    metric: normalised_name_equality
    operator: "="
    threshold_lower: 1
    threshold_upper: null
    action_required: BLOCK_AND_ESCALATE
    effective_from: "2016-02-25"
    provenance:
      source_document: RBI Master Direction - Know Your Customer, 2016
      section_heading: Obligations under UAPA / designated lists
      source_page: null

  - clause_id: SANCTIONS_FUZZY_REVIEW_FLOOR
    metric: jarowinkler_similarity_pct
    operator: ">="
    threshold_lower: 92
    threshold_upper: 99
    action_required: MANUAL_REVIEW
    effective_from: "2016-02-25"
    provenance:
      source_document: Internal - AML Policy
      section_heading: Name screening - probable match handling
      source_page: null
    notes: >
      Implemented with the built-in JAROWINKLER_SIMILARITY function. Produces
      a review task, never an automatic filing.

  # -------------------------------------------------------------------------
  # Mule-ring graph traversal (on-demand agent tool, not a dynamic table).
  # -------------------------------------------------------------------------
  - clause_id: MULE_RING_MAX_DEPTH
    metric: fund_flow_cycle_depth
    operator: "<="
    threshold_lower: 3
    threshold_upper: null
    action_required: RAISE_SIGNAL
    effective_from: "2016-02-25"
    provenance:
      source_document: FATF - Money Laundering Typologies (layering)
      section_heading: Circular fund flows
      source_page: null

  # -------------------------------------------------------------------------
  # Filing lifecycle. Drives CASE.sla_deadline.
  # -------------------------------------------------------------------------
  - clause_id: STR_FILING_SLA_DAYS
    metric: working_days_to_file_str
    operator: "<="
    threshold_lower: 7
    threshold_upper: null
    action_required: FILE_STR
    effective_from: "2005-07-01"
    provenance:
      source_document: PML (Maintenance of Records) Rules, 2005
      section_heading: Rule 8 - furnishing of information
      source_page: null
    notes: >
      Suspicious transaction reports not later than seven working days from
      the date of establishing suspicion.

  - clause_id: PRINCIPAL_OFFICER_ATTESTATION_REQUIRED
    metric: human_attestation_required
    operator: "="
    threshold_lower: 1
    threshold_upper: null
    action_required: BLOCK_AUTO_FILING
    effective_from: "2005-07-01"
    provenance:
      source_document: PML (Maintenance of Records) Rules, 2005
      section_heading: Rule 7 - Principal Officer obligations
      source_page: null
    notes: >
      The Principal Officer bears the filing obligation. Autonomous filing is
      legally invalid, not merely imprudent. Enforced in code, not in prose.

# ---------------------------------------------------------------------------
# Typology catalogue -- seed for GOVERNANCE.TYPOLOGY.
#
# Field names match the TYPOLOGY table, plus two generation-side fields:
#   injection_label    -- TXN_LABELS.injection_method for injected cohorts
#   expected_rule_ids  -- copied into EVAL_GRAIN_PARTY_MONTH so per-rule recall
#                         needs no hand-written mapping in the eval code.
#
# expected_rule_ids is deliberately EMPTY for every AMLworld graph typology.
# Which rule should catch a FAN-OUT or a STACK is an empirical claim, assigned
# when those rules exist and their recall has been measured -- not asserted
# here in advance. amlworld_pattern values are the exact labels in
# HI-Small_Patterns.txt (8 measured; 3 carry no ":" detail suffix).
# References are left null rather than cited from memory.
# ---------------------------------------------------------------------------
typologies:
  - typology_id: TYP_STRUCTURING
    name: structuring
    description: Cash deposits split across accounts to stay below the CTR trigger.
    detection_approach: rules
    amlworld_pattern: null
    injection_label: reskin_structuring
    expected_rule_ids: [STRUCTURING_CROSS_ACCOUNT]
    fatf_reference: null
    rbi_reference: PML (Maintenance of Records) Rules, 2005 - Rule 3(1)(A)
  - typology_id: TYP_MULE_FAN_IN
    name: mule_fan_in
    description: Many remitters credit one account in a short window.
    detection_approach: rules
    amlworld_pattern: null
    injection_label: reskin_mule_fan_in
    expected_rule_ids: [RAPID_CREDIT_VELOCITY]
    fatf_reference: null
    rbi_reference: null
  - typology_id: TYP_DORMANT_REACTIVATION
    name: dormant_reactivation
    description: A long-dormant account abruptly resumes high activity.
    detection_approach: rules
    amlworld_pattern: null
    injection_label: reskin_dormant_reactivation
    expected_rule_ids: []
    fatf_reference: null
    rbi_reference: null
  - { typology_id: TYP_AML_FAN_OUT,        name: fan_out,        amlworld_pattern: FAN-OUT,        detection_approach: graph, injection_label: amlworld_original, expected_rule_ids: [], fatf_reference: null, rbi_reference: null, description: One account disperses funds to many. }
  - { typology_id: TYP_AML_FAN_IN,         name: fan_in,         amlworld_pattern: FAN-IN,         detection_approach: graph, injection_label: amlworld_original, expected_rule_ids: [], fatf_reference: null, rbi_reference: null, description: Many accounts concentrate funds into one. }
  - { typology_id: TYP_AML_CYCLE,          name: cycle,          amlworld_pattern: CYCLE,          detection_approach: graph, injection_label: amlworld_original, expected_rule_ids: [], fatf_reference: null, rbi_reference: null, description: Funds return to the originating account through a chain. }
  - { typology_id: TYP_AML_GATHER_SCATTER, name: gather_scatter, amlworld_pattern: GATHER-SCATTER, detection_approach: graph, injection_label: amlworld_original, expected_rule_ids: [], fatf_reference: null, rbi_reference: null, description: Fan-in to an intermediary followed by fan-out. }
  - { typology_id: TYP_AML_SCATTER_GATHER, name: scatter_gather, amlworld_pattern: SCATTER-GATHER, detection_approach: graph, injection_label: amlworld_original, expected_rule_ids: [], fatf_reference: null, rbi_reference: null, description: Fan-out through intermediaries that reconverge. }
  - { typology_id: TYP_AML_BIPARTITE,      name: bipartite,      amlworld_pattern: BIPARTITE,      detection_approach: graph, injection_label: amlworld_original, expected_rule_ids: [], fatf_reference: null, rbi_reference: null, description: Flows between two disjoint account sets. }
  - { typology_id: TYP_AML_STACK,          name: stack,          amlworld_pattern: STACK,          detection_approach: graph, injection_label: amlworld_original, expected_rule_ids: [], fatf_reference: null, rbi_reference: null, description: Layered bipartite hops. }
  - { typology_id: TYP_AML_RANDOM,         name: random_walk,    amlworld_pattern: RANDOM,         detection_approach: graph, injection_label: amlworld_original, expected_rule_ids: [], fatf_reference: null, rbi_reference: null, description: Funds moved along a random path of hops. }

# ---------------------------------------------------------------------------
# Rule registry -- seed for GOVERNANCE.RULE_DEFINITION.
#
# Only rules whose detection SQL is BUILT are listed: a registry row for a rule
# that does not exist would let a finding cite logic nobody wrote. Each rule
# names the clauses it implements (a rule with none is ungoverned and fails the
# deploy) and takes its severity from `severity` below.
#
# The seed is insert-only for a (rule_id, rule_version) that already exists; if
# the live row differs from this file the deploy FAILS instead of overwriting it.
# Changing a rule means a new rule_version, so past signals keep the version
# that fired (EVIDENCE_CHAIN.SIGNAL.rule_version).
# ---------------------------------------------------------------------------
rules:
  - rule_id: STRUCTURING_CROSS_ACCOUNT
    rule_version: 1
    typology_id: TYP_STRUCTURING
    clause_ids: [CTR_CASH_THRESHOLD, STRUCTURING_BAND, STRUCTURING_MIN_ACCOUNTS, STRUCTURING_WINDOW_DAYS]
    description: >
      One party receives cash deposits within STRUCTURING_BAND of the CTR
      threshold into at least STRUCTURING_MIN_ACCOUNTS distinct accounts within
      one STRUCTURING_WINDOW_DAYS observation window.
    detection_grain: PARTY_WINDOW
    # Observation windows are tumbling, window_clause_id's threshold_lower days
    # long, counted from window_anchor. The Unix epoch is used because it is not
    # a choice that could be tuned to the data. With the current 30-day clause,
    # the window holding 2022-09-01 runs 2022-08-26..09-24 (bucket 641), so the
    # whole 10-day legit window falls inside a single bucket.
    window_clause_id: STRUCTURING_WINDOW_DAYS
    window_anchor: "1970-01-01"
    is_active: true
    admissible_as_primary_evidence: true

# ---------------------------------------------------------------------------
# Payment rails -- seed for GOVERNANCE.REF_CHANNEL. Every channel that
# conf/generation.yml can emit must be listed (asserted by a test).
# is_cash decides CTR applicability: a wrong value silently changes which
# transactions are reportable. typical_max_inr is left null rather than quoted
# from memory.
# ---------------------------------------------------------------------------
channels:
  - { channel_code: CASH,   channel_name: Cash at branch counter,                 is_cash: true,  is_instant: true,  typical_max_inr: null }
  - { channel_code: UPI,    channel_name: Unified Payments Interface,             is_cash: false, is_instant: true,  typical_max_inr: null }
  - { channel_code: IMPS,   channel_name: Immediate Payment Service,              is_cash: false, is_instant: true,  typical_max_inr: null }
  - { channel_code: NEFT,   channel_name: National Electronic Funds Transfer,     is_cash: false, is_instant: false, typical_max_inr: null }
  - { channel_code: RTGS,   channel_name: Real Time Gross Settlement,             is_cash: false, is_instant: true,  typical_max_inr: null }
  - { channel_code: CHEQUE, channel_name: Cheque clearing,                        is_cash: false, is_instant: false, typical_max_inr: null }

# ---------------------------------------------------------------------------
# Severity mapping: rule -> signal severity. Drives ROUTE_SIGNALS case
# creation and the Sentinel triage ordering.
# ---------------------------------------------------------------------------
severity:
  SANCTIONS_MATCH_NEW: CRITICAL
  MULE_RING_CANDIDATE: HIGH
  STRUCTURING_CROSS_ACCOUNT: HIGH
  SHARED_DEVICE_CLUSTER: MEDIUM
  RAPID_CREDIT_VELOCITY: MEDIUM
  INCOME_ACTIVITY_MISMATCH: MEDIUM
  VELOCITY_ANOMALY_ML: LOW

routing:
  # GAP-11: "existing case" definition, needed for idempotent case dedup.
  open_case_statuses: [OPEN, INVESTIGATING, DRAFTED]
  # A case is created only at or above this severity; below it the signal is
  # logged without a case.
  min_severity_for_case: MEDIUM
  severity_order: [LOW, MEDIUM, HIGH, CRITICAL]
  # Two or more distinct rule families on one party escalate to CROSS_DOMAIN,
  # which is the cross-silo narrative.
  cross_domain_min_distinct_rules: 2
