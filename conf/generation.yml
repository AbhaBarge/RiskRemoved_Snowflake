# ===========================================================================
# generation.yml -- synthetic data generation parameters
# ===========================================================================
# Every number that shapes the dataset lives here. Changing the seed and
# re-running must reproduce a byte-identical dataset: that is what makes the
# evaluation numbers defensible.
# ===========================================================================

seed: 20260922        # master seed; every sub-generator derives from it

# ---------------------------------------------------------------------------
# Source-data facts, MEASURED against the HI-Small files on 2026-09-26. Each
# one contradicted an assumption in the original design; the generator asserts
# them at run time rather than trusting this comment.
#
#   * Ledger span is 2022-09-01 .. 2022-09-18: 18 days, not 12 months -- and
#     LEGITIMATE activity ends on 09-10: 99.98% of pairs fall on 09-01..09-10,
#     while 09-11..09-18 holds 1,108 pairs, 59% of them illicit (M21).
#   * 5,078,345 pairs; 5,177 carry is_laundering=1 (0.102%). Only 3,209 of those
#     are attributed to an attempt in the Patterns file; the other 1,968 are
#     labelled illicit with no typology.
#   * Every one of the 3,209 Patterns rows matches exactly ONE ledger row, so
#     label attribution is unambiguous (GAP-09's premise does not hold here).
#   * Bank ids are zero-padded in Trans/Patterns and not in accounts; see
#     risk_copilot.ids.normalise_bank_id.
#   * 3,208 of 3,209 attributed illicit rows are ACH. No AMLworld typology
#     exercises the CASH channel, so structuring can only be injected.
# ---------------------------------------------------------------------------
source:
  # Bitcoin has no Indian-banking analogue: no FX rate, no rail. 146,091 pairs
  # carry it as a payment format; a further ~2K carry it only as a currency.
  # It touches 1 attributed illicit row (1 STACK attempt of 370).
  exclude_payment_formats: [Bitcoin]
  exclude_currencies: [Bitcoin]
  # whole_pair_and_attempt: an excluded pair is dropped whole (never one leg,
  # which would break money conservation), and any laundering attempt that
  # contains a dropped pair is dropped whole -- a truncated cycle is not a
  # cycle, and labelling half of one would corrupt per-typology recall.
  exclusion_policy: whole_pair_and_attempt
  # data/MANIFEST.yml keys for each source role. Row and attempt totals are
  # asserted against the manifest entries, never against literals in code.
  datasets:
    ledger: amlworld_transactions
    accounts: amlworld_accounts
    patterns: amlworld_patterns
  # File-format facts, measured 2026-09-26 (build log M14-M16).
  ledger:
    timestamp_format: "%Y/%m/%d %H:%M"
    # Every non-Bitcoin amount carries exactly 2 decimal places; Bitcoin carries
    # 6 (148,151 received / 146,066 paid values). Parsed at scale 6 so nothing is
    # rounded on read -- the reader FAILS rather than rescale if a later revision
    # carries more. Max integer part is 13 digits, so precision 20 has headroom.
    amount_precision: 20
    amount_scale: 6

# ---------------------------------------------------------------------------
# GAP-02 -- subgraph sampling.
# AMLworld ships 518,581 accounts / ~700K entities. We do NOT generate parties
# independently and hope they join: we sample a CONNECTED subgraph of the real
# transaction graph and then enrich the preserved keys. Seeding from the
# laundering attempts guarantees the illicit typologies survive sampling.
# ---------------------------------------------------------------------------
subgraph:
  # laundering_patterns -- seed from every account named in HI-Small_Patterns.txt
  #                        (370 attempts, 3,170 accounts, 2,851 parties).
  # injection_hosts     -- seed from the structuring cohort's host parties only.
  #                        The dev thin slice uses this: its one rule is
  #                        cash-based and no AMLworld typology uses cash.
  seed_source: laundering_patterns
  expansion_hops: 2                  # BFS hops along the transaction graph
  target_parties: 5000
  target_accounts: 10000
  # LEGS, not pairs: RAW_TRANSACTIONS is leg-level, so one pair costs two.
  # Includes injected legs: the worst case of every enabled cohort
  # (parties x accounts_max x deposits_max x 2) is reserved from this budget
  # before sampling, so the total can never exceed it.
  max_transactions: 400000
  # A leg is kept only if BOTH sides resolve to a sampled account. Guarantees
  # referential integrity of counterparty_account_id by construction.
  require_both_legs_resolvable: true
  # Cap on how much of one high-degree hub's neighbourhood is pulled in, so a
  # single hub cannot dominate the sample. Counts NEW neighbour accounts per
  # frontier account, ranked by stable_hash -- never by file order.
  max_neighbours_per_account: 40
  # Inclusion is ACCOUNT-level: a sampled party carries only its sampled
  # accounts, as a bank sees only the accounts it holds. Party-closed inclusion
  # was measured and rejected (M17): accounts per entity are heavy-tailed (22
  # entities hold >1,000, max 7,820), and demo's laundering seeds alone would
  # bring 96,886 accounts against a 10,000 budget. Structuring hosts are the one
  # exception -- seeded with ALL their accounts, since the rule is cross-account.
  #
  # The budgets above are hard: a candidate that would exceed one is skipped,
  # and a seed set that alone exceeds them fails the build rather than being
  # subsampled. A laundering attempt that sampling captures only partly is
  # dropped whole, for the reason source.exclusion_policy gives: a truncated
  # cycle is not a cycle. Only `drop` is implemented.
  partial_attempts: drop

# ---------------------------------------------------------------------------
# GAP-06 -- FX. A blanket x83 is wrong across 14 currencies. Rates are
# indicative period rates for the AMLworld window (2022 H2), applied per
# source currency.
# ---------------------------------------------------------------------------
fx:
  base_currency: INR
  rates_to_inr:
    "US Dollar": 82.50
    "Euro": 86.20
    "UK Pound": 99.40
    "Yen": 0.58
    "Yuan": 11.50
    "Rupee": 1.00
    "Australian Dollar": 54.80
    "Canadian Dollar": 60.90
    "Swiss Franc": 87.60
    "Mexican Peso": 4.15
    "Ruble": 1.05
    "Saudi Riyal": 22.00
    "Shekel": 24.10
    "Brazil Real": 15.60
  # ISO 4217 code per AMLworld currency name, for the legs retained in foreign
  # currency. An unmapped currency FAILS reskin rather than being guessed.
  iso_codes:
    "US Dollar": USD
    "Euro": EUR
    "UK Pound": GBP
    "Yen": JPY
    "Yuan": CNY
    "Rupee": INR
    "Australian Dollar": AUD
    "Canadian Dollar": CAD
    "Swiss Franc": CHF
    "Mexican Peso": MXN
    "Ruble": RUB
    "Saudi Riyal": SAR
    "Shekel": ILS
    "Brazil Real": BRL
  # Share of PAIRS whose legs keep their source currency, so cross-border signals
  # have something to bite on. Drawn per pair from a stable hash; a Rupee side
  # is INR either way. amount_inr is always populated.
  retain_foreign_pct: 5.0
  rounding_decimals: 2
  # A decimal-module rounding constant. Conversion is Decimal throughout: a
  # binary float would put sub-paise noise on the amounts the CTR rule compares.
  rounding_mode: ROUND_HALF_UP

# ---------------------------------------------------------------------------
# Channel remapping: AMLworld payment formats -> Indian rails.
# ---------------------------------------------------------------------------
channel_map:
  ACH: NEFT
  Wire: RTGS
  Cheque: CHEQUE
  Cash: CASH
  "Credit Card": UPI
  Reinvestment: IMPS
channel_default: NEFT

# Leg txn_type by AMLworld payment format and leg side. A Cash pair is posted as
# a cash WITHDRAWAL by the payer and a cash DEPOSIT by the payee -- the same
# shape as an injected structuring deposit. That matters (M19): 3,701 legit
# AMLworld cash credits land inside STRUCTURING_BAND after FX, and they must look
# like deposits for the rule's false-positive control to mean anything.
txn_types:
  default: { debit: TRANSFER, credit: TRANSFER }
  by_format:
    Cash: { debit: WITHDRAWAL, credit: DEPOSIT }
    "Credit Card": { debit: PAYMENT, credit: PAYMENT }

# ---------------------------------------------------------------------------
# GAP-03 -- pair-to-leg conversion.
# One AMLworld pair row becomes two rows sharing a txn_pair_id: a signed
# negative debit on the sender and a signed positive credit on the receiver.
# The pair-level shape used by graph queries is exposed as V_TRANSACTION_PAIRS.
# ---------------------------------------------------------------------------
legs:
  debit_sign: -1
  credit_sign: 1
  # AMLworld carries distinct paid/received amounts for FX pairs; each leg
  # keeps its own side's amount so money conservation holds per currency.
  use_side_specific_amounts: true
  # source_ref is an OPAQUE reference (a UTR-like token) for every leg, source
  # and injected alike. The DDL once specified "amlworld:<n>" / "inject:<cohort>":
  # the prefix alone separates injected rows, the cohort name is a label, and
  # <n> joins back to RAW_AMLWORLD_TRANS.is_laundering. Provenance lives in
  # GROUND_TRUTH.TXN_LABELS (txn_id -> src_row_number / injection_method).
  source_ref_prefix: UTR
  source_ref_hex_digits: 16
  # reference_text stays NULL for every leg until the L3 narration generator
  # exists: a template applied to one population only would be a label.

# ---------------------------------------------------------------------------
# GROUND_TRUTH.TXN_LABELS.injection_method for every leg that came from the
# AMLworld ledger, illicit or not. Must equal the injection_label of the
# AMLworld typologies in conf/detection.yml (asserted by a test).
# ---------------------------------------------------------------------------
labels:
  source_injection_method: amlworld_original

# ---------------------------------------------------------------------------
# L1 -- entity enrichment. These attributes DRESS the preserved AMLworld keys.
# Attributes are derived from hash(entity_id), so a rerun is idempotent and a
# party's identity is stable even if the sample changes size.
# ---------------------------------------------------------------------------
entities:
  # en_IN, not hi_IN (M20): hi_IN writes names and companies in Devanagari and
  # formats phone numbers as "+91 0433218196". Core banking records, the
  # OpenSanctions list and JAROWINKLER_SIMILARITY screening are all Latin-script;
  # en_IN gives Indian names in Latin script with the same determinism.
  faker_locale: en_IN
  # Recorded in the generation manifest: Faker output is only reproducible on
  # the same Faker version.
  record_faker_version: true
  # Keyed on the AMLworld entity_name prefix ("Corporation #33520"). Measured
  # mix: Corporation 55,530 / Sole Proprietorship 55,369 / Partnership 55,170 /
  # Individual 134 / Country 2 / Direct 2.
  party_type_from_entity_name:
    Corporation: LEGAL_PERSON
    Partnership: LEGAL_PERSON
    # The RBI KYC Master Direction performs CDD on the proprietor as an
    # individual, so a sole proprietorship is typed as one. Leaving it as a legal
    # person made the customer base 99.9% companies (134 individuals in 166K).
    "Sole Proprietorship": INDIVIDUAL
    Company: LEGAL_PERSON
    Individual: INDIVIDUAL
    # Not customers. "Country #1" holds 6,677 accounts and 75% of Bitcoin flow;
    # the previous default would have made it a single INDIVIDUAL party.
    Country: EXTERNAL
    Direct: EXTERNAL
  # null: an unmapped prefix FAILS generation instead of being guessed. Every
  # prefix present in the source is mapped above.
  party_type_default: null
  # Parties of these types, and every pair touching one of their accounts, are
  # excluded under source.exclusion_policy.
  excluded_party_types: [EXTERNAL]

  # Must match roles.branch_analysts keys in conf/base.yml. Drives RLS.
  branch_regions:
    - { code: MUMBAI, weight: 0.40 }
    - { code: DELHI,  weight: 0.35 }
    - { code: PUNE,   weight: 0.25 }   # no analyst role -> proves RLS excludes

  account_types:
    - { code: SAVINGS,     weight: 0.45 }
    - { code: CURRENT,     weight: 0.25 }
    - { code: LOAN,        weight: 0.12 }
    - { code: CREDIT_CARD, weight: 0.10 }
    - { code: FD,          weight: 0.08 }

  pep_pct: 1.5
  risk_rating_distribution:
    LOW: 0.70
    MEDIUM: 0.22
    HIGH: 0.08
  kyc_status_distribution:
    VERIFIED: 0.88
    PENDING_REVIEW: 0.09
    EXPIRED: 0.03

  # Dates are drawn relative to the ledger's first observed day (measured from
  # the sampled legs, never written here), so every record predates the
  # transactions it explains.
  dates:
    individual_age_years: { min: 21, max: 75 }
    # customer_since is never earlier than this age (or than incorporation).
    min_customer_age_years: 18
    incorporation_years_ago: { min: 1, max: 40 }
    customer_tenure_years: { min: 1, max: 15 }
    kyc_review_max_days_ago: 730
  nationality: IN
  party_status: ACTIVE
  account_status: ACTIVE
  branches_per_region: 5
  # Python str.format over region / index.
  branch_code_template: "{region}-{index:02d}"
  # Indian mobile numbers: +91, then a first digit in 6-9, then 9 more digits.
  phone:
    country_code: "+91"
    first_digits: [6, 7, 8, 9]
    subscriber_digits: 9
  # Synthetic PAN: 5 letters, 4 digits, 1 letter; the 4th letter encodes the
  # holder type, as on a real PAN (P = individual, C = company).
  pan_holder_code:
    INDIVIDUAL: P
    LEGAL_PERSON: C
  source_of_funds:
    INDIVIDUAL:
      - { code: SALARY, weight: 0.45 }
      - { code: BUSINESS_INCOME, weight: 0.35 }
      - { code: INVESTMENTS, weight: 0.12 }
      - { code: PENSION, weight: 0.08 }
    LEGAL_PERSON:
      - { code: BUSINESS_REVENUE, weight: 0.80 }
      - { code: INVESTMENT_INCOME, weight: 0.12 }
      - { code: LOAN_PROCEEDS, weight: 0.08 }
  # Account balances: a lognormal opening balance plus the account's net INR
  # flow in the window, floored at zero.
  balance:
    opening_lognormal_mu: 11.5        # median ~ Rs 99K
    opening_lognormal_sigma: 1.2
  # Credit products carry a limit; everything else has NULL.
  credit_limit:
    account_types: [LOAN, CREDIT_CARD]
    min_inr: 50000
    max_inr: 2500000
    round_to_inr: 10000

  # -------------------------------------------------------------------------
  # GAP-04 -- declared income MUST correlate with observed legitimate inflow,
  # or INCOME_ACTIVITY_MISMATCH fires on everybody or nobody. Income is
  # derived from each party's own legit 12-month inflow, divided by a
  # plausible coverage ratio, with lognormal noise. The illicit cohort then
  # deliberately under-declares, which is what the rule is supposed to find.
  # -------------------------------------------------------------------------
  #
  # The ledger spans 18 days, of which legitimate activity occupies 10 (M21), so
  # there is no 12-month inflow to observe. The window's legit inflow is
  # annualised by annualise_to_days / observed LEGIT span, where the span is
  # MEASURED from the sampled legit legs at run time, never written here.
  # Measured effect (M12, over an 18-day denominator): a legit party at median
  # draws sits at an inflow-to-declared ratio of ~0.057 against
  # INCOME_MISMATCH_MULTIPLE's 3.0, so noise alone does not fire the rule.
  #
  # ceiling_inr was REMOVED. Capping declared income below a party's real
  # capacity manufactures a mismatch: at Rs 25 cr it would have flagged 9,755
  # legit-only entities. Plausibility is reported by the income_calibration
  # gate instead of being forced by a cap.
  # -------------------------------------------------------------------------
  income:
    derive_from: legit_inflow_window_annualised
    annualise_to_days: 365
    coverage_ratio_mean: 1.15        # declared ~= annualised legit inflow / 1.15
    coverage_ratio_sigma: 0.28
    # The coverage draw is normal, so it is floored: a draw near zero would
    # declare an absurd income.
    coverage_ratio_min: 0.30
    noise_lognormal_sigma: 0.22
    floor_inr: 180000
    round_to_inr: 10000
    # UNCALIBRATED for an 18-day window: at 0.35 only 104 of 3,255 AMLworld
    # launderers would fire. Recalibrated when INCOME_ACTIVITY_MISMATCH lands;
    # it is not a thin-slice rule. Applied to every party holding an illicit
    # leg (AMLworld-labelled or an injection host).
    illicit_cohort_under_declare_factor: 0.35

  # -------------------------------------------------------------------------
  # GAP-05 -- shared device fingerprints must be co-located with existing fund
  # flows, because SHARED_DEVICE_CLUSTER requires shared device AND flow
  # between the accounts. Random assignment yields zero detections.
  # -------------------------------------------------------------------------
  device:
    shared_fingerprint_pct: 8.0
    # Fraction of shared-device clusters placed on account groups that already
    # transact with each other. The remainder are decoys (shared device, no
    # flow) that the rule must correctly NOT fire on -- these are the
    # false-positive control.
    colocate_with_fund_flow_pct: 70.0
    cluster_size_min: 3
    cluster_size_max: 5
    # A co-located cluster spans accounts of at least this many DIFFERENT
    # parties ("device sharing across unrelated customers", TM-15).
    cluster_min_distinct_parties: 2
    fingerprint_prefix: DFP-
    fingerprint_hex_digits: 16

  relationships:
    shared_phone_pct: 4.0
    beneficial_owner_pct: 6.0
    # FUND_FLOW edges are derived from transactions, not generated.
    fund_flow_min_txn_count: 2
    relationship_id_prefix: REL-

# ---------------------------------------------------------------------------
# Institution-owned accounts.
#
# A cash deposit is Dr branch cash / Cr customer, which is how a core banking
# system posts it. AMLworld has no such convention to borrow: all 490,891 of its
# Cash rows are party-to-party payments. The cash desk is the ONE deliberate
# exception to "never mint ids", and it is kept narrow:
#
#   * its ids still derive deterministically through risk_copilot.ids, from
#     keys that cannot collide with AMLworld (bank ids there are numeric,
#     entity ids hex; these contain letters and ':'),
#   * it is written ONLY to ID_MAP_PARTY / ID_MAP_ACCOUNT, never to
#     RAW_PARTY_CBS / RAW_PARTY_KYC / RAW_ACCOUNTS, so every customer-facing
#     table excludes it by construction,
#   * downstream, DT_PARTY_RELATIONSHIP must exclude src_bank_id below from
#     FUND_FLOW, or the desk becomes a hub joining every depositor.
# ---------------------------------------------------------------------------
internal_accounts:
  src_bank_id: INTERNAL
  owner_entity_key: "INTERNAL:BANK"
  cash_desk:
    account_number_prefix: CASH_DESK   # -> CASH_DESK:<branch_region>
    per: branch_region

# ---------------------------------------------------------------------------
# GAP-06/07 -- typology injection.
# FX conversion alone cannot create Rs 9.4-9.8L clusters against a Rs 10L
# trigger: structuring is INJECTED as a separate, explicitly labelled cohort.
# Bands are expressed as fractions of the CTR threshold resolved from
# GOVERNANCE.POLICY_CLAUSE (CTR_CASH_THRESHOLD), never as literals.
#
# AMOUNTS ARE DEFERRED. generate emits each injected deposit as a fraction of
# the CTR threshold, not in rupees; `load` resolves
#   amount_inr = ROUND(amount_ctr_ratio * threshold_lower, rounding_decimals)
# by joining V_POLICY_CLAUSE_CURRENT on ctr_clause_id. The threshold therefore
# really comes from POLICY_CLAUSE at runtime while generation stays offline.
# The ratio lives in GROUND_TRUTH.INJECTED_TXN_PENDING, never in a RAW file:
# a column present only on injected rows would be a label.
# ---------------------------------------------------------------------------
injection:
  structuring:
    enabled: true
    cohort_parties: 40
    host_party_type: INDIVIDUAL
    # Hosts are real AMLworld entities (M13), ranked by stable_hash and SEEDED
    # into the subgraph in every profile -- a host outside the sample cannot be
    # injected. A host with any is_laundering=1 pair would carry a second,
    # unrelated label, so hosts must have a clean history; and it needs real
    # traffic, or it is an isolated island in the sample.
    host_requires_clean_history: true
    host_min_ledger_pairs: 1
    # A cash deposit lands in a deposit account. A host qualifies only if at
    # least accounts_per_party_min of its accounts draw one of these types
    # (account type is a pure function of the account id, so sampling can check
    # it), and injection deposits only into them.
    deposit_account_types: [SAVINGS, CURRENT]
    accounts_per_party_min: 2
    accounts_per_party_max: 4
    deposits_per_account_min: 3
    deposits_per_account_max: 6
    # Asserted to lie within STRUCTURING_BAND by the injection_band gate.
    amount_band_pct_of_ctr: [0.90, 0.985]
    # 21 -> 14 (D8) -> 7 (D18). The ledger's LEGITIMATE activity spans 10 days
    # (2022-09-01..09-10, M21); 09-11..09-18 is 59% laundering. Deposits are
    # placed inside the measured legit window, and the injection_window gate
    # asserts window_days <= that span and <= STRUCTURING_WINDOW_DAYS. A week-long
    # burst leaves the placement room to vary per host.
    window_days: 7
    # Over-the-counter cash is deposited in branch hours: [start, end) local
    # time, minute resolution like the AMLworld timestamps. Deposits at 03:00
    # would be recognisable by their clock alone.
    deposit_hours: [10, 16]
    channel: CASH
    txn_type: DEPOSIT
    debit_side: cash_desk            # see internal_accounts
    amount_resolution: deferred_ctr_ratio
    # Matches INJECTED_TXN_PENDING.amount_ctr_ratio NUMBER(12,10): sub-paise
    # resolution at any plausible threshold, and exactly representable in Parquet.
    amount_ctr_ratio_decimals: 10
    ctr_clause_id: CTR_CASH_THRESHOLD
    band_clause_id: STRUCTURING_BAND
    window_clause_id: STRUCTURING_WINDOW_DAYS
    min_accounts_clause_id: STRUCTURING_MIN_ACCOUNTS
    typology_id: TYP_STRUCTURING
    label: reskin_structuring

  # Not in the thin slice (S6): injection is structuring-only until the
  # slice runs end to end. Disabled so generate never claims to have built them.
  rapid_credit_velocity:
    enabled: false
    cohort_parties: 30
    remitters_min: 7
    remitters_max: 14
    credits_min: 11
    credits_max: 22
    window_days: 3
    label: reskin_mule_fan_in

  # INFEASIBLE on this source as configured: 180 days of dormancy cannot exist
  # in an 18-day ledger. Needs synthesised pre-window history or a shorter
  # dormancy definition -- a decision, not a tweak.
  dormant_reactivation:
    enabled: false
    cohort_parties: 20
    dormancy_days_min: 180
    burst_txn_count_min: 8
    label: reskin_dormant_reactivation

# ---------------------------------------------------------------------------
# GAP-07 -- realism validation. These are ASSERTED, not claimed. `riskcopilot
# generate` fails if a gate with fail_build: true is violated.
# The AMLworld base rate is 0.063%; subgraph sampling seeded from laundering
# accounts raises it, so the band is stated as a range and enforced.
# ---------------------------------------------------------------------------
validation:
  illicit_rate_pct:
    min: 0.10
    # Raised from 1.50 (decision 2026-09-26). Seeding the demo subgraph from
    # laundering accounts concentrates illicit legs to ~2%; that is the known,
    # accepted cost of guaranteeing every typology survives sampling.
    max: 2.50
    fail_build: true
  bank_id_resolution:
    # Every sampled leg's (bank, account) must resolve to an owning entity.
    # Catches a regression of the zero-padding defect immediately.
    max_unresolved_legs: 0
    fail_build: true
  label_attribution:
    # Measured 1:1 on the source. Asserted, so a different AMLworld revision
    # that breaks it fails loudly instead of lowering match_confidence quietly.
    require_unique_match: true
    fail_build: true
  id_map_one_to_one:
    # A surrogate collision would merge two entities. Fail rather than merge.
    fail_build: true
  injection_window:
    # window_days <= observed ledger span and <= STRUCTURING_WINDOW_DAYS.
    fail_build: true
  injection_band:
    # amount_band_pct_of_ctr must lie within STRUCTURING_BAND, or the cohort
    # is built to be undetectable.
    fail_build: true
  income_calibration:
    # Reports the distribution of generated inflow-to-declared ratios. A
    # property of the generated data, not a re-implementation of the rule.
    fail_build: false
  money_conservation:
    # Every pair must have exactly one debit leg and one credit leg.
    max_unpaired_legs: 0
    fail_build: true
  referential_integrity:
    max_orphan_account_refs: 0
    max_orphan_party_refs: 0
    fail_build: true
  benford:
    # Chi-square of leading-digit distribution against Benford, legit legs only.
    max_chi_square: 60.0
    fail_build: false          # reported on the realism slide, not a gate
  degree_distribution:
    min_power_law_alpha: 1.5
    max_power_law_alpha: 3.5
    fail_build: false
  label_leakage:
    # V6: no label column may be reachable from the semantic view. Checked
    # against every RAW output file.
    forbidden_columns:
      - is_laundering
      - is_illicit
      - typology_id
      - injection_method
      - amlworld_pattern
      - attempt_id
      - match_confidence
      - amount_ctr_ratio
      - cohort
    fail_build: true
  # EVALUATED AFTER LOAD, in Snowflake, against the real detection SQL.
  # Re-implementing the rules in Python to fake this offline would put
  # detection logic outside Snowflake. Offline, generate checks only that each
  # cohort was CONSTRUCTED to be detectable, and reports this gate as deferred.
  signal_yield:
    # Each Tier-1 rule must produce a non-trivial, non-absurd number of
    # detections, otherwise generation is miscalibrated (this is what catches
    # GAP-04 and GAP-05 regressions automatically).
    min_detections_per_rule: 5
    max_detections_per_rule: 2000
    fail_build: true

# ---------------------------------------------------------------------------
# GAP-18 -- the demo hero party must be SELECTED, not assumed. The docs
# hardcode P-10042 / "Rajesh Kumar"; party ids are generated, so the demo
# script would be fiction. This step picks a party that provably trips every
# listed rule and writes the resolved id to conf/generated/demo_entity.yml.
# ---------------------------------------------------------------------------
demo_entity:
  must_trigger_rules:
    - STRUCTURING_CROSS_ACCOUNT
    - RAPID_CREDIT_VELOCITY
    - SHARED_DEVICE_CLUSTER
  prefer_branch_region: MUMBAI
  prefer_party_type: INDIVIDUAL
  fail_if_not_found: true

# ---------------------------------------------------------------------------
# L3 narratives (AI_COMPLETE). Models resolve from conf/models.yml.
# ---------------------------------------------------------------------------
narratives:
  kyc_notes:
