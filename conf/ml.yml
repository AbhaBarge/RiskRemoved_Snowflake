# ===========================================================================
# ml.yml -- Snowflake-native ML
# ===========================================================================
# Tier-1 scope is deliberately narrow: the two cheapest high-impact items,
# both of which are BUILT-IN SQL and need no snowflake-ml-python, no compute
# pool, and no model training infrastructure. Everything heavier is recorded
# under future_scope so it can be presented as a considered decision rather
# than an omission.
#
# HARD BOUNDARY, inherited from the LLM boundary rule:
#   ML output may RANK, PRIORITISE and FLAG FOR REVIEW.
#   ML output may never be the sole basis of a filing, and never supplies a
#   number that appears in an artifact. Scores are not evidence.
# ===========================================================================

enabled: true

tier1:

  # -------------------------------------------------------------------------
  # 1. Fuzzy sanctions screening -- JAROWINKLER_SIMILARITY / EDITDISTANCE.
  #
  # The architecture CUT fuzzy matching as too complex and fell back to exact
  # joins. It is a single built-in scalar function. Restoring it recovers a
  # genuine capability (aliases, transliterations -- the normal case for
  # sanctions screening on Indian names) at near-zero cost.
  # -------------------------------------------------------------------------
  fuzzy_sanctions:
    enabled: true
    method: JAROWINKLER_SIMILARITY
    # Thresholds resolve from GOVERNANCE.POLICY_CLAUSE
    # (SANCTIONS_EXACT_MATCH, SANCTIONS_FUZZY_REVIEW_FLOOR) -- not from here.
    exact_match_clause_id: SANCTIONS_EXACT_MATCH
    review_floor_clause_id: SANCTIONS_FUZZY_REVIEW_FLOOR
    # Blocking key keeps the cross join tractable against ~500K sanctions rows:
    # candidates must agree on a coarse key before the expensive comparison.
    blocking:
      strategy: soundex_first_token_plus_length_bucket
      max_candidates_per_party: 50
    normalisation:
      uppercase: true
      strip_punctuation: true
      collapse_whitespace: true
      # Dropped before comparison so "Kumar Trading Pvt Ltd" matches "Kumar
      # Trading Private Limited".
      drop_tokens: [LTD, LIMITED, PVT, PRIVATE, LLP, INC, CORP, CO, AND, THE]
    outcome:
      exact: SIGNAL                 # SANCTIONS_MATCH_NEW, severity CRITICAL
      fuzzy: MANUAL_REVIEW          # review task; never an automatic filing

  # -------------------------------------------------------------------------
  # 2. Unsupervised velocity anomaly -- SNOWFLAKE.ML.ANOMALY_DETECTION.
  #
  # This is the honest answer to "rule-based TMS produce an 80-95% false
  # positive rate": a per-account behavioural baseline catches deviations that
  # no fixed threshold expresses. Unsupervised, so it does NOT consume
  # GROUND_TRUTH.LABELS and cannot leak them.
  # -------------------------------------------------------------------------
  # CAPABILITY: confirmed available on this STANDARD trial account.
  # conf/generated/capabilities.<conn>.yml records
  # SNOWFLAKE.ML.ANOMALY_DETECTION available: true. An earlier revision of
  # preconditions.require_edition asserted Enterprise and thereby disabled a
  # working feature -- see the note on require_edition below.
  velocity_anomaly:
    enabled: true
    function: SNOWFLAKE.ML.ANOMALY_DETECTION
    model_name: RC_VELOCITY_ANOMALY_MODEL
    # Trains on the daily aggregate, which is incremental-safe (GAP-09).
    training_source: DT_TXN_DAILY_AGG
    series_column: account_id
    timestamp_column: txn_date
    target_column: credit_amount_inr
    # Accounts with too little history produce meaningless baselines.
    #
    # UNRESOLVED, and deliberately left as a visible contradiction rather than
    # quietly lowered: the AMLworld HI-Small source spans 2022-09-01 to
    # 2022-09-18 -- 18 days, measured, not 12 months. No profile can satisfy a
    # 45-day baseline from this data, so this feature is capability-available
    # but data-starved. Resolving it means one of: lower the baseline to fit 18
    # days and say so, synthesise pre-window history, or keep 45 and report the
    # signal as not-yet-trainable. It must not be decided by silently editing
    # this number.
    min_history_days: 45
    prediction_interval: 0.99
    schedule: USING CRON 0 3 * * * Asia/Kolkata
    outcome:
      signal_type: VELOCITY_ANOMALY_ML
      severity: LOW                 # ranks work; never justifies a filing
      # Recorded so the Sentinel can say "flagged by baseline deviation, not by
      # a rule" and the Reviewer can reject any artifact that cites it as
      # primary evidence.
      admissible_as_primary_evidence: false

# ---------------------------------------------------------------------------
# Deferred. Each entry states what it would add and why it is not in Tier 1,
# so the "What Production Would Need" slide is specific rather than hand-wavy.
# ---------------------------------------------------------------------------
future_scope:

  feature_store:
    package: snowflake.ml.feature_store
    what: >
      Register the velocity features as Feature Views on ACCOUNT and PARTY
      entities, with generate_training_set() for point-in-time-correct
      retrieval.
    why_it_matters: >
      The current design would build any training set by joining current
      feature values to historical labels, which leaks future information and
      inflates measured performance. A Feature Store is the correct fix, not an
      optimisation.
    why_deferred: >
      SCOPE, NOT CAPABILITY. ML_FEATURE_STORE probes available: true on this
      account, so this is deferred only because Tier 1 trains no supervised
      model and therefore has no leakage to mitigate. Do not record it as
      blocked.

  triage_classifier:
    package: SNOWFLAKE.ML.CLASSIFICATION
    what: >
      Supervised risk score trained on GROUND_TRUTH.LABELS with velocity and
      graph features, used ONLY to order the Sentinel's queue.
    why_it_matters: Directly attacks analyst time-to-first-true-positive.
    why_deferred: >
      NOT SERVED IN THIS REGION. Probed on AWS_AP_SOUTHEAST_7 and recorded as
      unavailable with failure_class a_absent, error 398208 -- the object does
      not exist in this region. This is not an edition or trial gate, so
      converting the trial will not fix it; it needs a different region.
      Independently of availability, it would also require the Feature Store
      for point-in-time correctness, or the reported lift is an artefact of
      leakage, plus a train/test split by TIME rather than at random, because
      the graph makes random splits leak.
    guardrail: Ranking only. Never enters EVIDENCE, FINDING or ARTIFACT.

  top_insights:
    package: SNOWFLAKE.ML.TOP_INSIGHTS
    what: Explain which attributes drive week-over-week alert-volume shifts.
    why_it_matters: Turns the Sentinel summary from a list into an explanation.
    why_deferred: >
      NOT SERVED IN THIS REGION. Probed on AWS_AP_SOUTHEAST_7 and recorded as
      unavailable with failure_class a_absent, error 002143. Regional, not
      edition or trial: converting the account will not fix it. Would in any
      case need several weeks of history, and the source data spans 18 days.

  model_registry:
    package: snowflake.ml.registry
    what: Version and log any custom model; surface model_version in lineage.
    why_it_matters: >
      AUDIT.AGENT_ACTION_LOG.model_version is only trustworthy if models are
      registered artefacts rather than ad-hoc SQL calls.
    why_deferred: >
      SCOPE, NOT CAPABILITY. ML_MODEL_REGISTRY probes available: true on this
      account. Deferred because Tier 1 registers no custom model.

  ml_jobs:
    package: snowflake.ml.jobs
    what: Run graph-feature extraction (node2vec-style embeddings) on SPCS.
    why_it_matters: Learned graph embeddings outperform hand-written cycle rules.
    why_deferred: Needs a compute pool; far beyond hackathon scope.

  embedding_entity_resolution:
    package: AI_EMBED / VECTOR_COSINE_SIMILARITY
    what: >
      Resolve aliases and transliterations via embeddings instead of edit
      distance, populating PARTY.match_confidence.
    why_it_matters: >
      Jaro-Winkler fails on transliteration variants
      ("Mohammed"/"Muhammad"/"Mohd"), which is the dominant real-world case.
    why_deferred: >
      Tier-1 Jaro-Winkler covers the demo; embedding the full OpenSanctions
      target set is a material cost.

  ai_contradiction_detection:
    package: AI_CLASSIFY / AI_FILTER
    what: >
      Detect KYC narrative notes that contradict the structured record, which
      generation deliberately injects at 8%.
    why_it_matters: Reconciling conflicting evidence is squarely an LLM task.
    why_deferred: Tier 1 surfaces both facts and lets the agent reconcile them.

# ---------------------------------------------------------------------------
# Preconditions the doctor must confirm before any ML step is deployed. ML
# functions are edition- and region-gated; a hard failure at demo time is
# unacceptable, so an unmet precondition disables the feature and says so.
# ---------------------------------------------------------------------------
preconditions:
  # Empty by design, and this is a correction rather than an omission.
  #
  # This key previously read [ENTERPRISE, BUSINESS_CRITICAL], which made the
  # doctor warn on a STANDARD account and disabled tier1.velocity_anomaly. The
  # probe sweep disproves the premise: on this STANDARD trial account
  # SNOWFLAKE.ML.ANOMALY_DETECTION, SNOWFLAKE.ML.FORECAST, ML_MODEL_REGISTRY
  # and ML_FEATURE_STORE all record available: true. Edition is the wrong gate
  # for these functions.
  #
  # Availability is therefore decided per function by recorded evidence
  # (verify_functions below, plus risk_copilot.capabilities against
  # conf/generated/capabilities.<connection>.yml), never inferred from the
  # edition string. The two ML functions that genuinely are unavailable here --
  # CLASSIFICATION and TOP_INSIGHTS -- are blocked REGIONALLY (a_absent), which
  # an edition precondition would have mis-attributed anyway.
  require_edition: []
  verify_functions:
    - JAROWINKLER_SIMILARITY
    - EDITDISTANCE
    - SOUNDEX
    - SNOWFLAKE.ML.ANOMALY_DETECTION
  on_unavailable: disable_and_report
