# ===========================================================================
# conf/profiles/dev.yml -- development overlay
# ===========================================================================
# Deep-merged over conf/base.yml. Only differences belong here.
# Activate with:  riskcopilot --profile dev <command>   or  RC_PROFILE=dev
# ===========================================================================

profile: dev

project:
  # Every object gets a _DEV suffix so a dev deploy can never overwrite the
  # demo objects in the same account.
  object_suffix: _DEV

# Slower lags: dev does not need minute-level freshness and every refresh
# costs credits.
dynamic_tables:
  transactions_enriched: { target_lag: 60 minutes }
  signals_fast:          { target_lag: 60 minutes }
  signals_aggregate:     { target_lag: 24 hours }

streams_tasks:
  route_signals_schedule: 60 minutes

retention:
  # Capped at 1 day because the dev account is Standard edition, where 1 day is
  # the maximum allowable Time Travel window -- anything higher is rejected at
  # CREATE SCHEMA time ("Exceeds maximum allowable retention time"). Extended
  # Time Travel needs Enterprise. Correctness is unaffected: the Reviewer reads
  # EVIDENCE_QUERY_LOG.result_snapshot, and Time Travel is the demonstrable
  # provenance layer on top of it. demo.yml still asks for 14 and is clamped at
  # load time from the recorded probe evidence (config.py, RetentionClamp);
  # doctor reports the reduction.
  landing_days: 1
  evidence_days: 1

warehouses:
  pipeline:
    size: XSMALL
  demo:
    size: XSMALL

# Small sample for a fast build/test loop. Validation gates still run, so
# calibration bugs surface here rather than at demo time.
#
# THIN SLICE (S6, decision 2026-09-26): dev seeds from the structuring cohort's
# host parties, not from the 370 laundering attempts. The laundering seed set
# alone is 2,851 parties -- 5.7x this budget -- and the slice's only rule is
# cash-based while AMLworld laundering is 99.97% ACH, so no AMLworld typology
# is needed to validate it. Switch seed_source back to laundering_patterns when
# rules 2-6 land; nothing else changes.
generation_overrides:
  subgraph:
    seed_source: injection_hosts
    target_parties: 500
    target_accounts: 1000
    max_transactions: 40000
  injection:
    structuring:
      # 40 parties x ~3 accounts x ~4.5 deposits x 2 legs is ~1,080 illicit legs
      # in 40K, or ~2.7%: above the illicit_rate_pct ceiling. 10 lands ~0.7%.
      cohort_parties: 10
  demo_entity:
    # The other listed rules do not exist in the slice yet.
    must_trigger_rules: [STRUCTURING_CROSS_ACCOUNT]
  narratives:
    kyc_notes:
      count: 200
    case_comments:
      count: 50
    golden_documents:
      count: 2
  validation:
    signal_yield:
      min_detections_per_rule: 1

ml_overrides:
  tier1:
    velocity_anomaly:
      # The source ledger spans 18 days in EVERY profile, so no profile can
      # support the 45-day baseline yet (see conf/ml.yml). Disabled here to keep
      # the dev deploy quiet; demo will surface the contradiction instead.
      enabled: false
